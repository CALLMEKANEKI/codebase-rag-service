name: Development retrieval evaluation

permissions:
  contents: read

on:
  push:
    branches:
      - work/wp6-retrieval-reranking
    paths:
      - .github/workflows/eval-dev.yml
      - eval/runner.py
      - eval/metrics.py
      - rag/generation/context.py
      - tests/test_generation.py
      - eval/retrieval_experiment_protocol.md
  workflow_dispatch:

jobs:
  retrieval-eval-dev:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-ml.txt
            requirements-torch-cpu.txt

      - name: Install project dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install -r requirements-torch-cpu.txt
          python -m pip install -r requirements-ml.txt

      - name: Checkout pinned FastAPI corpus
        uses: actions/checkout@v4
        with:
          repository: fastapi/fastapi
          ref: 79cab5bed28b24d92c185d236feb33f5783dfeb3
          path: benchmark-repos/fastapi
          persist-credentials: false

      - name: Checkout pinned Flask corpus
        uses: actions/checkout@v4
        with:
          repository: pallets/flask
          ref: d086db856be187255b8ec61ef409357393020f32
          path: benchmark-repos/flask
          persist-credentials: false

      - name: Run Vietnamese Dev retrieval evaluation
        run: |
          python -m eval.runner \
            --dataset eval/datasets/dev/E2_Dev_24.jsonl \
            --fastapi-root benchmark-repos/fastapi \
            --flask-root benchmark-repos/flask \
            --output eval/results/dev-vi \
            --device cpu \
            --reranker-device cpu

      - name: Upload Dev evaluation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retrieval-evaluation-dev-vi
          path: eval/results/dev-vi/
          if-no-files-found: warn
          retention-days: 30
