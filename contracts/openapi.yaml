openapi: 3.1.0
info:
  title: Codebase RAG Service API
  version: 0.3.0
  summary: Approved multi-index contract Web <-> RAG (v0.3)
  description: |
    Nguon su that cua Contract Web <-> RAG. Trang "03 - Quy uoc & kien truc chung" tren Notion
    mo ta cac quyet dinh; neu file nay lech voi Notion thi sua file cho khop (hoac cap nhat Notion
    truoc khi sua file).

    Quy tac chung:
    - Moi endpoint can header `X-API-Key`, ngoai tru `GET /v1/health`.
    - `X-Request-ID` la header tuy chon. Neu client gui, RAG tra lai cung gia tri trong response.
    - Moi loi (ke ca 401, 404, 409, 422, 5xx) deu theo dang `{ "error": { "code", "message", "details" } }`.
    - Loi phat sinh sau khi job index da duoc nhan (repo qua lon, clone loi...) KHONG tra HTTP loi dong bo;
      chung duoc phan anh qua `status = failed` va `error.code` o `GET /v1/indexes/{id}`.
    - Frontend khong goi RAG truc tiep; chi Web Backend goi RAG (giu `X-API-Key`).
    - `POST /v1/query` giu nguyen de backward compatibility; `POST /v1/query/multi` la multi-index path.
servers:
  - url: http://localhost:8000
    description: Local development
security:
  - ApiKeyAuth: []
tags:
  - name: Health
  - name: Indexes
  - name: Query
  - name: Files
paths:
  /v1/health:
    get:
      operationId: getHealth
      tags: [Health]
      summary: Health check
      description: Khong can API key.
      security: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Service dang chay.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                status: ok
  /v1/indexes:
    post:
      operationId: createIndex
      tags: [Indexes]
      summary: Tao index cho mot repository (bat dong bo)
      description: |
        Kiem tra `repo_url` (dinh dang + allowlist) duoc thuc hien dong bo; sai thi tra `422 INVALID_REPO`.
        Sau khi nhan job, RAG tra `202` va xu ly nen: pending -> cloning -> parsing -> embedding -> ready
        (hoac failed). Client theo doi bang `GET /v1/indexes/{id}`.
        Chi nhan public GitHub repository dang `https://github.com/<owner>/<repo>`.
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateIndexRequest'
            example:
              repo_url: https://github.com/pallets/flask
              ref: main
              client_ref: repo_record_42
      responses:
        '202':
          description: Job index da duoc nhan.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateIndexResponse'
              example:
                index_id: idx_3f9a1c
                status: pending
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          description: URL sai dinh dang hoac nam ngoai allowlist (INVALID_REPO), hoac request khong hop le (INVALID_REQUEST).
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: INVALID_REPO
                  message: Only public GitHub repositories (https://github.com/<owner>/<repo>) are supported
                  details:
                    repo_url: https://gitlab.com/org/repo
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/indexes/{id}:
    get:
      operationId: getIndex
      tags: [Indexes]
      summary: Lay trang thai index
      parameters:
        - $ref: '#/components/parameters/IndexId'
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Trang thai hien tai cua index.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndexStatus'
              examples:
                ready:
                  summary: Index da san sang
                  value:
                    index_id: idx_3f9a1c
                    status: ready
                    stage: null
                    progress:
                      files_done: 24
                      total_files: 24
                    commit_sha: d086db856be187255b8ec61ef409357393020f32
                    stats:
                      files: 24
                      chunks: 412
                    error: null
                embedding:
                  summary: Dang tao embedding
                  value:
                    index_id: idx_3f9a1c
                    status: embedding
                    stage: embedding
                    progress:
                      files_done: 10
                      total_files: 24
                    commit_sha: d086db856be187255b8ec61ef409357393020f32
                    stats: null
                    error: null
                failed:
                  summary: Index that bai
                  value:
                    index_id: idx_3f9a1c
                    status: failed
                    stage: cloning
                    progress: null
                    commit_sha: null
                    stats: null
                    error:
                      code: REPO_TOO_LARGE
                      message: Repository exceeds the configured size limit
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/IndexNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      operationId: deleteIndex
      tags: [Indexes]
      summary: Xoa index va artifact lien quan
      description: |
        Xoa snapshot, vector collection, du lieu BM25 va dong registry cua index.
        Idempotent: xoa index khong ton tai van tra `204`.
        Neu index dang chay thi job duoc huy truoc khi don dep.
      parameters:
        - $ref: '#/components/parameters/IndexId'
        - $ref: '#/components/parameters/RequestId'
      responses:
        '204':
          description: Da xoa (hoac index khong ton tai).
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/indexes/{id}/files:
    get:
      operationId: getIndexFile
      tags: [Files]
      summary: Doc noi dung file tu snapshot (cho Code Viewer)
      description: |
        Doc dung snapshot gan voi index (khong lay ban moi nhat tu GitHub).
        Yeu cau bao mat:
        - chong path traversal: duong dan duoc resolve va bat buoc nam trong snapshot; tu choi `..` va symlink
          (tra `404 FILE_NOT_FOUND`);
        - toi da 2000 dong moi request;
        - neu `end` vuot qua cuoi file thi bi cat ve dong cuoi; `start` vuot qua cuoi file la `400 INVALID_RANGE`.
        Index chua `ready` tra `409 INDEX_NOT_READY`.
      parameters:
        - $ref: '#/components/parameters/IndexId'
        - $ref: '#/components/parameters/RequestId'
        - name: path
          in: query
          required: true
          description: Duong dan file tuong doi so voi goc repository (dau `/`, dung `/` lam dau phan cach).
          schema:
            type: string
            minLength: 1
            maxLength: 1024
          example: src/flask/app.py
        - name: start
          in: query
          required: false
          description: Dong bat dau (tinh tu 1, bao gom).
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: end
          in: query
          required: false
          description: Dong ket thuc (bao gom). Bo qua thi tra toi da 2000 dong ke tu `start`.
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Noi dung doan file yeu cau.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileContent'
              example:
                path: src/flask/app.py
                start: 34
                end: 36
                content: "def verify_token(token: str) -> dict:\n    ...\n    return payload\n"
                language: python
        '400':
          description: Khoang dong khong hop le (start > end, start vuot qua cuoi file, hoac qua 2000 dong).
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: INVALID_RANGE
                  message: Requested line range is invalid
                  details:
                    start: 500
                    end: 100
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Index hoac file khong ton tai (INDEX_NOT_FOUND hoac FILE_NOT_FOUND).
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: FILE_NOT_FOUND
                  message: File not found in index snapshot
                  details:
                    path: src/flask/missing.py
        '409':
          $ref: '#/components/responses/IndexNotReady'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/query/multi:
    post:
      operationId: queryMultipleIndexes
      tags: [Query]
      summary: Dat cau hoi tren nhieu index trong Conversation Scope
      description: |
        Web Backend gui danh sach index da duoc xac thuc va cho phep trong Conversation Scope.
        RAG truy van Focus truoc; neu evidence chua du, co the fallback sang cac repository khac
        trong Scope. RAG fusion evidence, deduplicate va chi tao mot cau tra loi cuoi cung.
        Khong duoc truy van index ngoai Scope. Focus rong nghia la truy van toan bo Scope.
        MVP sufficiency heuristic: Focus duoc coi la du khi co it nhat hai non-empty chunks
        tren cac repository Focus da truy van. Day la proxy dinh luong, khong phai danh gia
        ngu nghia rang buoc cau hoi voi evidence.
        Moi request co mot absolute deadline toi da 60 giay, bao gom retrieval, fallback,
        fusion, generation va tat ca model fallback attempts. Khong tu dong retry POST.
        Endpoint nay chi duoc goi boi Web Backend; index_id la trusted server-to-server data.
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MultiQueryRequest'
            example:
              question: Trace how an order response is produced and consumed.
              scope:
                - repository_id: web-repository-guid-a
                  index_id: idx_backend_a
                  display_name: orders-api
                - repository_id: web-repository-guid-b
                  index_id: idx_client_b
                  display_name: orders-client
              focus_repository_ids: [web-repository-guid-a]
              top_k: 8
              options:
                mode: hybrid
                rerank: false
              debug: false
      responses:
        '200':
          description: Ket qua truy van da fusion, co the completed hoac partial/no_evidence.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MultiQueryResponse'
              example:
                execution_status: partial
                answer_status: answered
                answer: "API defines the field [1]; client consumes it in the order summary [2]."
                focus:
                  requested_repository_ids: [web-repository-guid-a]
                  searched_focus_repository_ids: [web-repository-guid-a]
                  fallback_repository_ids: [web-repository-guid-b]
                  fallback_triggered: true
                  fallback_reason: focused_evidence_insufficient
                repository_outcomes:
                  - repository_id: web-repository-guid-a
                    index_id: idx_backend_a
                    commit_sha: abc123
                    outcome: searched_with_evidence
                    reason: null
                    evidence_count: 2
                    latency_ms: 38
                  - repository_id: web-repository-guid-b
                    index_id: idx_client_b
                    commit_sha: def456
                    outcome: searched_with_evidence
                    reason: null
                    evidence_count: 1
                    latency_ms: 42
                citations:
                  - ref_id: 1
                    repository_id: web-repository-guid-a
                    index_id: idx_backend_a
                    commit_sha: abc123
                    file_path: app/routes/orders.py
                    symbol: get_order
                    symbol_kind: function
                    start_line: 20
                    end_line: 42
                    snippet: "..."
                    score: 0.91
                usage: null
                latency_ms: 920
                debug: null
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/InvalidRequest'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          description: Loi tu LLM provider trong giai doan generation.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: LLM_ERROR
                  message: The language model request failed
                  details: {}
        '503':
          description: Khong co index nao trong Scope co the truy van.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: ALL_INDEXES_UNAVAILABLE
                  message: No supplied index is available for querying
                  details:
                    repository_outcomes:
                      - repository_id: web-repository-guid-a
                        outcome: unavailable
                        reason: index_not_ready
        '504':
          description: Vuot absolute deadline 60 giay cua toan bo multi-index request.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: TIMEOUT
                  message: The request timed out
                  details: {}
  /v1/query:
    post:
      operationId: queryIndex
      tags: [Query]
      summary: Dat cau hoi ve mot index da ready
      description: |
        Single-turn. Citation chi lay tu cac chunk da cap cho LLM va duoc he thong kiem tra lai;
        `[n]` trong `answer` tuong ung `citations[].ref_id`.
        Baseline MVP chi ho tro `options.mode = dense` va `rerank = false`; gia tri chua ho tro
        tra `422 INVALID_REQUEST`.
        Legacy single-index timeout/retry behavior remains unchanged. Multi-index timeout is governed by its own 60-second absolute deadline; query POST is not automatically retried.
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueryRequest'
            example:
              index_id: idx_3f9a1c
              question: JWT duoc kiem tra o dau?
              top_k: 5
              options:
                mode: dense
                rerank: false
              debug: false
      responses:
        '200':
          description: Cau tra loi kem citation.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueryResponse'
              example:
                answer: "JWT duoc kiem tra trong `verify_token` [1]."
                citations:
                  - ref_id: 1
                    file_path: app/core/security.py
                    symbol: verify_token
                    symbol_kind: function
                    start_line: 34
                    end_line: 58
                    snippet: "def verify_token(token: str) -> dict:\n    ..."
                    score: 0.91
                usage: null
                latency_ms: 850
                debug: null
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/IndexNotFound'
        '409':
          $ref: '#/components/responses/IndexNotReady'
        '422':
          $ref: '#/components/responses/InvalidRequest'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          description: Loi tu LLM (Gemini API).
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: LLM_ERROR
                  message: The language model request failed
                  details: {}
        '504':
          description: Het thoi gian xu ly.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: TIMEOUT
                  message: The request timed out
                  details: {}
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: Khoa dich vu RAG. Chi Web Backend giu khoa nay; khong dua vao frontend, khong ghi log.
  headers:
    RequestId:
      description: Gia tri X-Request-ID duoc tra lai (neu client co gui).
      schema:
        type: string
        maxLength: 128
  parameters:
    RequestId:
      name: X-Request-ID
      in: header
      required: false
      description: Ma truy vet do client dat, RAG tra lai trong response.
      schema:
        type: string
        maxLength: 128
    IndexId:
      name: id
      in: path
      required: true
      description: Ma index do RAG cap (`index_id`).
      schema:
        type: string
        pattern: '^idx_[A-Za-z0-9_-]+$'
      example: idx_3f9a1c
  responses:
    Unauthorized:
      description: Thieu hoac sai X-API-Key.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: UNAUTHORIZED
              message: Missing or invalid API key
              details: {}
    IndexNotFound:
      description: Khong tim thay index.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: INDEX_NOT_FOUND
              message: Index not found
              details:
                index_id: idx_3f9a1c
    IndexNotReady:
      description: Index chua o trang thai ready.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: INDEX_NOT_READY
              message: Index is not ready
              details:
                status: embedding
    InvalidRequest:
      description: Request khong hop le (validation, cau hoi qua dai, tuy chon chua ho tro).
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: INVALID_REQUEST
              message: Validation failed
              details:
                field: question
                reason: exceeds maximum length of 2000 characters
    InternalError:
      description: Loi noi bo.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: INTERNAL_ERROR
              message: Unexpected server error
              details: {}
  schemas:
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
    ErrorCode:
      type: string
      description: |
        INVALID_REQUEST khong co trong danh sach 11 ma ban dau cua Contract v0.2 Draft;
        duoc de xuat them de dung cho loi validation (422).
      enum:
        - UNAUTHORIZED
        - REPO_NOT_FOUND
        - REPO_TOO_LARGE
        - INVALID_REPO
        - INVALID_REQUEST
        - ALL_INDEXES_UNAVAILABLE
        - INDEX_NOT_READY
        - INDEX_NOT_FOUND
        - FILE_NOT_FOUND
        - INVALID_RANGE
        - LLM_ERROR
        - TIMEOUT
        - INTERNAL_ERROR
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, details]
          properties:
            code:
              $ref: '#/components/schemas/ErrorCode'
            message:
              type: string
            details:
              type: object
              additionalProperties: true
    CreateIndexRequest:
      type: object
      required: [repo_url]
      properties:
        repo_url:
          type: string
          description: Public GitHub repository, dang `https://github.com/<owner>/<repo>` (khong co `.git`, khong co dau `/` o cuoi).
          pattern: '^https://github\.com/[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$'
          maxLength: 300
        ref:
          type: string
          description: Branch, tag hoac commit. Bo qua thi dung default branch.
          minLength: 1
          maxLength: 255
        client_ref:
          type: string
          description: Chuoi tuy chon do Web dat (vi du id ban ghi repository). RAG chi luu de debug, khong dung lam khoa.
          maxLength: 200
    CreateIndexResponse:
      type: object
      required: [index_id, status]
      properties:
        index_id:
          type: string
          pattern: '^idx_[A-Za-z0-9_-]+$'
        status:
          type: string
          enum: [pending]
    IndexStatusValue:
      type: string
      enum: [pending, cloning, parsing, embedding, ready, failed]
    IndexProgress:
      type: object
      required: [files_done, total_files]
      properties:
        files_done:
          type: integer
          minimum: 0
        total_files:
          type: integer
          minimum: 0
    IndexStats:
      type: object
      required: [files, chunks]
      properties:
        files:
          type: integer
          minimum: 0
        chunks:
          type: integer
          minimum: 0
    IndexError:
      type: object
      required: [code, message]
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
    IndexStatus:
      type: object
      required: [index_id, status]
      properties:
        index_id:
          type: string
          pattern: '^idx_[A-Za-z0-9_-]+$'
        status:
          $ref: '#/components/schemas/IndexStatusValue'
        stage:
          type: [string, 'null']
          enum: [cloning, parsing, embedding, null]
          description: |
            Buoc dang chay, hoac buoc ma index that bai (khi `status = failed`).
            `null` khi `pending` hoac `ready`.
        progress:
          oneOf:
            - $ref: '#/components/schemas/IndexProgress'
            - type: 'null'
          description: "`null` cho den khi biet tong so file."
        commit_sha:
          type: [string, 'null']
          description: Commit da duoc resolve luc clone (`null` truoc khi clone xong).
        stats:
          oneOf:
            - $ref: '#/components/schemas/IndexStats'
            - type: 'null'
          description: Co gia tri khi `status = ready`.
        error:
          oneOf:
            - $ref: '#/components/schemas/IndexError'
            - type: 'null'
          description: Co gia tri khi `status = failed`.
    QueryOptions:
      type: object
      properties:
        mode:
          type: string
          enum: [dense, bm25, hybrid]
          default: dense
          description: Baseline MVP chi ho tro `dense`.
        rerank:
          type: boolean
          default: false
          description: Baseline MVP chua ho tro `true`.
    QueryRequest:
      type: object
      required: [index_id, question]
      properties:
        index_id:
          type: string
          pattern: '^idx_[A-Za-z0-9_-]+$'
        question:
          type: string
          minLength: 1
          maxLength: 2000
        top_k:
          type: integer
          minimum: 1
          maximum: 20
          default: 5
        options:
          $ref: '#/components/schemas/QueryOptions'
        debug:
          type: boolean
          default: false
          description: "`true` thi tra them `debug` (cac chunk duoc retrieve va score)."
    Citation:
      type: object
      required:
        - ref_id
        - file_path
        - symbol
        - symbol_kind
        - start_line
        - end_line
        - snippet
        - score
      properties:
        ref_id:
          type: integer
          minimum: 1
          description: Khop voi marker `[n]` trong `answer`.
        file_path:
          type: string
        symbol:
          type: [string, 'null']
          description: Ten ham/class/method; `null` neu chunk khong gan voi symbol nao.
        symbol_kind:
          type: [string, 'null']
          description: "Vi du: function, method, class, module, other."
        start_line:
          type: integer
          minimum: 1
        end_line:
          type: integer
          minimum: 1
        snippet:
          type: string
        score:
          type: number
    Usage:
      type: object
      properties:
        input_tokens:
          type: [integer, 'null']
        output_tokens:
          type: [integer, 'null']
    RetrievedChunk:
      type: object
      required: [chunk_id, file_path, start_line, end_line, score]
      properties:
        chunk_id:
          type: string
        file_path:
          type: string
        symbol:
          type: [string, 'null']
        symbol_kind:
          type: [string, 'null']
        start_line:
          type: integer
          minimum: 1
        end_line:
          type: integer
          minimum: 1
        score:
          type: number
        used_in_context:
          type: boolean
    DebugInfo:
      type: object
      required: [mode, retrieved]
      properties:
        mode:
          type: string
          enum: [dense, bm25, hybrid]
        retrieved:
          type: array
          items:
            $ref: '#/components/schemas/RetrievedChunk'
    QueryResponse:
      type: object
      required: [answer, citations, latency_ms]
      properties:
        answer:
          type: string
        citations:
          type: array
          items:
            $ref: '#/components/schemas/Citation'
        usage:
          oneOf:
            - $ref: '#/components/schemas/Usage'
            - type: 'null'
        latency_ms:
          type: integer
          minimum: 0
        debug:
          oneOf:
            - $ref: '#/components/schemas/DebugInfo'
            - type: 'null'
    MultiQueryOptions:
      type: object
      properties:
        mode:
          type: string
          enum: [dense, bm25, hybrid]
          default: hybrid
          description: Retrieval mode for each index before evidence fusion.
        rerank:
          type: boolean
          default: false
          description: Reranking is opt-in; disabled by default.
    MultiQueryScopeItem:
      type: object
      required: [repository_id, index_id, display_name]
      properties:
        repository_id:
          type: string
          minLength: 1
          maxLength: 200
          description: Stable Web Repository ID; not an authorization key by itself.
        index_id:
          type: string
          pattern: '^idx_[A-Za-z0-9_-]+$'
          description: Trusted RAG index ID resolved server-side by Web Backend; never browser supplied.
        display_name:
          type: string
          minLength: 1
          maxLength: 300
          description: Normalized owner/repo display label.
    MultiQueryRequest:
      type: object
      required: [question, scope]
      properties:
        question:
          type: string
          minLength: 1
          maxLength: 2000
        scope:
          type: array
          minItems: 1
          maxItems: 5
          description: |
            Authorized conversation Scope. Repository IDs and index IDs must each be unique.
            RAG rejects a request above the configured cap; it never silently truncates.
          items:
            $ref: '#/components/schemas/MultiQueryScopeItem'
        focus_repository_ids:
          type: array
          uniqueItems: true
          description: |
            Optional soft preference. Every ID must be present in scope. Empty or omitted
            means search all Scope repositories without a preferred subset.
          items:
            type: string
            minLength: 1
            maxLength: 200
        top_k:
          type: integer
          minimum: 1
          maximum: 20
          default: 8
          description: Global final evidence chunk limit after fusion, not a per-index answer limit.
        options:
          $ref: '#/components/schemas/MultiQueryOptions'
        debug:
          type: boolean
          default: false
    MultiRepositoryOutcome:
      type: object
      required: [repository_id, index_id, outcome, reason, evidence_count, latency_ms]
      properties:
        repository_id:
          type: string
        index_id:
          type: string
        commit_sha:
          type: [string, 'null']
        outcome:
          type: string
          enum: [searched_with_evidence, searched_no_evidence, unavailable, failed, not_searched]
        reason:
          type: [string, 'null']
          enum:
            - focus_evidence_sufficient
            - index_not_found
            - index_not_ready
            - storage_error
            - timeout
            - retrieval_error
            - retrieval_capacity
            - null
        evidence_count:
          type: integer
          minimum: 0
        latency_ms:
          type: [integer, 'null']
          minimum: 0
    MultiQueryFocus:
      type: object
      required:
        - requested_repository_ids
        - searched_focus_repository_ids
        - fallback_repository_ids
        - fallback_triggered
        - fallback_reason
      properties:
        requested_repository_ids:
          type: array
          items:
            type: string
        searched_focus_repository_ids:
          type: array
          items:
            type: string
        fallback_repository_ids:
          type: array
          items:
            type: string
        fallback_triggered:
          type: boolean
        fallback_reason:
          type: [string, 'null']
          enum: [focused_evidence_insufficient, focused_sources_unavailable, null]
    MultiCitation:
      type: object
      required:
        - ref_id
        - repository_id
        - index_id
        - commit_sha
        - file_path
        - symbol
        - symbol_kind
        - start_line
        - end_line
        - snippet
        - score
      properties:
        ref_id:
          type: integer
          minimum: 1
          description: Matches [n] citation markers in answer.
        repository_id:
          type: string
        index_id:
          type: string
          pattern: '^idx_[A-Za-z0-9_-]+$'
        commit_sha:
          type: [string, 'null']
        file_path:
          type: string
        symbol:
          type: [string, 'null']
        symbol_kind:
          type: [string, 'null']
        start_line:
          type: integer
          minimum: 1
        end_line:
          type: integer
          minimum: 1
        snippet:
          type: string
        score:
          type: number
    MultiQueryDebug:
      type: object
      required: [candidate_count, fused_chunk_count, context_source_count, selected_evidence]
      properties:
        candidate_count:
          type: integer
          minimum: 0
          description: Total non-empty candidates returned by all searched repositories before fusion.
        fused_chunk_count:
          type: integer
          minimum: 0
          description: Number of candidates retained after cross-repository fusion and top_k.
        context_source_count:
          type: integer
          minimum: 0
          description: Number of evidence chunks actually included in the final model context.
        selected_evidence:
          type: array
          items:
            type: object
            required: [ref_id, repository_id, index_id, file_path, start_line, end_line]
            properties:
              ref_id:
                type: integer
                minimum: 1
              repository_id:
                type: string
              index_id:
                type: string
              commit_sha:
                type: [string, 'null']
              chunk_id:
                type: [string, 'null']
              file_path:
                type: string
              start_line:
                type: integer
                minimum: 1
              end_line:
                type: integer
                minimum: 1
              fused_rank:
                type: [integer, 'null']
                description: Position after global cross-repository fusion.
              score:
                type: [number, 'null']
                description: Reciprocal-rank fusion score.
    MultiQueryResponse:
      type: object
      required:
        - execution_status
        - answer_status
        - answer
        - focus
        - repository_outcomes
        - citations
        - latency_ms
        - debug
      properties:
        execution_status:
          type: string
          enum: [completed, partial]
        answer_status:
          type: string
          enum: [answered, no_evidence]
        answer:
          type: string
        focus:
          $ref: '#/components/schemas/MultiQueryFocus'
        repository_outcomes:
          type: array
          description: Exactly one outcome for each repository supplied in request scope.
          items:
            $ref: '#/components/schemas/MultiRepositoryOutcome'
        citations:
          type: array
          items:
            $ref: '#/components/schemas/MultiCitation'
        usage:
          oneOf:
            - $ref: '#/components/schemas/Usage'
            - type: 'null'
        latency_ms:
          type: integer
          minimum: 0
        debug:
          oneOf:
            - $ref: '#/components/schemas/MultiQueryDebug'
            - type: 'null'
    FileContent:
      type: object
      required: [path, start, end, content, language]
      properties:
        path:
          type: string
        start:
          type: integer
          minimum: 1
        end:
          type: integer
          minimum: 1
        content:
          type: string
        language:
          type: [string, 'null']
          description: "Vi du: python. `null` neu khong nhan dien duoc."